<link rel="stylesheet" href="styles.css" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); }
  /* calm content fade-in (skipped under reduced-motion via tokens) */
  .fade-in { animation: ss-fade var(--dur-fade) var(--ease-out) both; }
  @keyframes ss-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
  /* forced phone preview (via ?phone) — renders the mobile layout at any width */
  html.force-phone {
    --gutter-wide: 1.25rem; --content-max: 100%; --content-narrow: 100%; --cortex-gutter: 1rem;
    --fs-4xl: 3rem; --fs-3xl: 2.3rem; --fs-2xl: 1.9rem; --fs-xl: 1.5rem;
    --space-12: 5rem; --space-11: 4rem; --space-10: 3.5rem; --space-9: 3rem; --space-8: 2.5rem;
  }
  html.force-phone body { max-width: 412px; margin: 0 auto; box-shadow: 0 0 0 1px var(--border); min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--paper-700); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: var(--paper-950); }
  /* ---- responsive: shrink the layout tokens so inline var()-based
     padding/measures reflow on tablets & phones without per-component edits ---- */
  @media (max-width: 1024px) {
    :root { --gutter-wide: 2.5rem; --cortex-gutter: 2.5rem; }
  }
  @media (max-width: 760px) {
    :root {
      --gutter-wide: 1.25rem;
      --content-max: 100%;
      --content-narrow: 100%;
      --cortex-gutter: 1rem;
      --fs-4xl: 3rem; --fs-3xl: 2.3rem; --fs-2xl: 1.9rem; --fs-xl: 1.5rem;
      --space-12: 5rem; --space-11: 4rem; --space-10: 3.5rem; --space-9: 3rem; --space-8: 2.5rem;
    }
    /* the live network sits behind headers — let touches scroll the page */
    canvas { touch-action: pan-y; }
  }
</style>
</head>
